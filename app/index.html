<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PullPoint</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PullPoint">
<style>
  /* Guscio installabile: a tutto schermo mostra l'app PullPoint di Google Apps Script */
  :root { --bg: #FFFFFF; --ink: #17181C; --muted: #5E6068; --accent: #2647D9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15161A; --ink: #EDEBE6; --muted: #A3A5AB; --accent: #8096FF; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  .wait img { width: 96px; height: 96px; border-radius: 22px; }
  .wait p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 300px; }
  .wait a { color: var(--accent); font-weight: 700; text-decoration: none; padding: 10px 14px; }
  .wait[hidden] { display: none; }
</style>
</head>
<body>
<div class="wait" id="wait">
  <img src="icon-192.png" alt="">
  <p>Apertura di PullPoint…</p>
  <p id="help" hidden>Se resta bianca, entra in Google con il tuo account nel browser e riapri l'app, oppure <a id="direct" href="#">aprila nel browser</a>.</p>
</div>
<iframe id="app" title="PullPoint" allow="clipboard-write; camera"></iframe>
<script>
  // Indirizzo dell'app Google Apps Script (deployment "PullPoint App")
  var APP = 'https://script.google.com/macros/s/AKfycbwDhQ5VpvMW6aHKqRWyV_g4PB5Eo2d2hpIO9TKrxHZ0b_QpFOjNmnhlsE4N-KJYFMJM/exec';
  var f = document.getElementById('app');
  document.getElementById('direct').href = APP;
  f.style.visibility = 'hidden';
  f.addEventListener('load', function () { f.style.visibility = 'visible'; document.getElementById('wait').hidden = true; });
  f.src = APP;
  setTimeout(function () { if (f.style.visibility === 'hidden') document.getElementById('help').hidden = false; }, 12000);
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
</html>
